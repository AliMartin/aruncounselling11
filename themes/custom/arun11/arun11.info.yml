name: 'Arun Counselling 11'
type: theme
description: 'Arun Counselling 11 subtheme based on Bootstrap 5 theme.'
core_version_requirement: '^10.1 || ^11.0'
'base theme': bootstrap5
libraries:
  - arun11/global-styling
ckeditor_stylesheets:
  - css/style.css
ckeditor5-stylesheets:
  - css/ck5style.css
regions:
  header: Header
  nav_branding: 'Navigation branding region'
  nav_second: 'Secondary navigation region'
  nav_main: 'Main navigation region'
  breadcrumb: Breadcrumbs
  content: 'Main content'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer_region_1: 'Footer region first'
  footer_region_2: 'Footer region second'
  footer_region_3: 'Footer region third'
  footer_logos: 'Footer logos'
libraries-override:
  bootstrap5/global-styling: false
  bootstrap5/ckeditor5-stylesheets: false
