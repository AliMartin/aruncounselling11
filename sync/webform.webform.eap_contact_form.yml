id: eap_contact_form
title: 'EAP contact form'
description: '<p>EAP contact form</p>'
categories: {  }
elements: |-
  flexbox:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First name'
      '#title_display': invisible
      '#placeholder': 'First name'
      '#required': true
    surname:
      '#type': textfield
      '#title': Surname
      '#title_display': invisible
      '#placeholder': Surname
      '#required': true
  flexbox_01:
    '#type': webform_flexbox
    organisation:
      '#type': textfield
      '#title': Organisation
      '#title_display': invisible
      '#placeholder': Organisation
      '#required': true
    number_of_employees:
      '#type': select
      '#title': 'Number of employees'
      '#title_display': invisible
      '#options':
        1_to_10: '1 to 10'
        11_to_50: '11 to 50'
        more_than_50: 'More than 50'
      '#empty_option': 'Number of employees'
  flexbox_02:
    '#type': webform_flexbox
    location:
      '#type': textfield
      '#title': City/Town
      '#title_display': invisible
      '#placeholder': City/Town
    postcode:
      '#type': textfield
      '#title': Postcode
      '#title_display': invisible
      '#placeholder': Postcode
      '#required': true
  flexbox_03:
    '#type': webform_flexbox
    telephone:
      '#type': tel
      '#title': Telephone
      '#title_display': invisible
      '#placeholder': Telephone
      '#required': true
    email:
      '#type': email
      '#title': Email
      '#title_display': invisible
      '#placeholder': Email
      '#required': true
  consent:
    '#type': checkboxes
    '#title': Consent
    '#title_display': invisible
    '#options':
      'Yes': ' -- I consent to my data being processed by Arun Counselling Centre. Visit our <a href="/privacy-and-cookies" target="_blank">privacy page</a> to learn about we use your data.'
    '#required': true
    '#required_error': 'Please check the consent box so we can process your data.'
